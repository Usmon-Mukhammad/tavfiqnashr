# Regenerates the books catalogue HTML whenever Markdown or a cover changes.
#
# The admin Worker commits only content/books/** and assets/img/books/**. This
# workflow turns that into the committed HTML that GitHub Pages serves. The
# path filter deliberately excludes kitoblar/** and the homepages, so the
# commit this job makes cannot retrigger the job.
name: Build books

on:
  push:
    branches: [main]
    paths:
      - 'content/books/**'
      - 'assets/img/books/**'
      - 'tools/build-books.py'
  workflow_dispatch:

concurrency:
  group: build-books
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate catalogue HTML
        run: python3 tools/build-books.py

      - name: Commit regenerated HTML
        run: |
          if git diff --quiet -- kitoblar index.html ru.html; then
            echo "No HTML changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kitoblar index.html ru.html
          git commit -m "Rebuild catalogue from Markdown [skip ci]"
          git push
