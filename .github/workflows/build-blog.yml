# Regenerates the blog HTML whenever Markdown changes.
#
# The admin Worker commits only content/blog/**. This workflow turns that into
# the committed HTML that GitHub Pages serves. The path filter deliberately
# excludes blog/** and the homepages, so the commit this job makes cannot
# retrigger the job.
name: Build blog

on:
  push:
    branches: [main]
    paths:
      - 'content/blog/**'
      - 'tools/build-blog.py'
  workflow_dispatch:

concurrency:
  group: build-blog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate blog HTML
        run: python3 tools/build-blog.py

      - name: Commit regenerated HTML
        run: |
          if git diff --quiet -- blog index.html ru.html; then
            echo "No HTML changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog index.html ru.html
          git commit -m "Rebuild blog from Markdown [skip ci]"
          git push
